name: Publish Radio 345 Mini App

on:
  push:
    branches: [main]
    paths:
      - 'miniapp/**'
      - '.github/workflows/miniapp-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: radio345-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Prepare Mini App
        run: |
          mkdir -p _site
          cp miniapp/index.html _site/
          cp miniapp/styles.css _site/
          cp miniapp/app.js _site/
          cp miniapp/api.js _site/
          cp miniapp/notifications.js _site/
          cp miniapp/receiver-controls.js _site/
          cp miniapp/correction-editor.js _site/
          cp miniapp/client.js _site/
          cp miniapp/service-gate.js _site/
          cp miniapp/phrases.js _site/
          cp miniapp/keyboard.js _site/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload website
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
