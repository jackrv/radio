name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: radio345-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    # Apple Silicon: MLX і sounddevice (з вбудованим PortAudio) встановлюються
    # як на робочому Mac. Тести не завантажують моделі й не відкривають мікрофон.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check dependencies
        run: python -m pip check

      - name: Run tests
        run: python -m pytest -q -p no:cacheprovider --junitxml=pytest-report.xml

      - name: Report failed tests
        # Назва й причина кожного тесту, що впав, — анотаціями (їх видно без входу, на відміну від логу).
        if: failure()
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          for case in ET.parse("pytest-report.xml").iter("testcase"):
              for problem in list(case.findall("failure")) + list(case.findall("error")):
                  name = f"{case.get('classname')}::{case.get('name')}"
                  message = (problem.get("message") or "").replace("\n", " ")[:300]
                  print(f"::error title={name}::{message}")
          PY

  javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Syntax check
        # Скрипт панелі збирається з local_admin/js/*.js (як його віддає server/api/local_dashboard.py).
        run: |
          for file in apps/miniapp/*.js; do node --check "$file"; done
          node -e "new (require('vm').Script)(require('./tests/panel_source.cjs'))"

      - name: JavaScript tests
        run: node --test tests/*.cjs
