name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: radio345-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    # Apple Silicon: MLX і sounddevice (з вбудованим PortAudio) встановлюються
    # як на робочому Mac. Тести не завантажують моделі й не відкривають мікрофон.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check dependencies
        run: python -m pip check

      - name: Run tests
        run: python -m pytest -q -p no:cacheprovider

  javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntax check
        run: for file in miniapp/*.js; do node --check "$file"; done

      - name: Mini App tests
        run: node --test tests/miniapp.test.cjs
