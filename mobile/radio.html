<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Рація 345">
<meta name="theme-color" content="#0b111a">
<meta name="referrer" content="no-referrer">
<title>Рація 345</title>
<style>
/* Ті самі кольори, що в панелі й Mini App. */
:root {
  color-scheme: dark;
  --bg: #0b111a; --surface: #121c29; --surface2: #192737; --border: #273544;
  --text: #f4f7fb; --muted: #91a0b1; --lime: #b8ef86; --ok: #7fd8a4; --warn: #f0c46c; --bad: #ff8f8f;
  font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); }
[hidden] { display: none !important; }
main { max-width: 560px; margin: 0 auto; display: grid; gap: 14px; }
h1 { font-size: 22px; margin: 0; letter-spacing: -.02em; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px; }
.muted { color: var(--muted); font-size: 13px; margin: 0; }
button { font: inherit; border: 0; border-radius: 12px; cursor: pointer; }
#toggle { width: 100%; padding: 22px; font-size: 20px; font-weight: 700; background: var(--lime); color: #172414; }
#toggle.on { background: transparent; color: var(--lime); border: 2px solid var(--lime); }
.status { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 14px; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.ok { background: var(--ok); box-shadow: 0 0 10px var(--ok); }
.dot.warn { background: var(--warn); }
.dot.bad { background: var(--bad); }
#last { white-space: pre-wrap; margin: 6px 0 0; }
ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
li { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start;
  background: var(--surface2); border-radius: 10px; padding: 10px; }
li.new { outline: 1px solid var(--lime); }
li button { background: transparent; color: var(--lime); border: 1px solid #4f7359; width: 40px; height: 40px; font-size: 16px; }
li .meta { color: var(--muted); font-size: 12px; }
li .text { white-space: pre-wrap; font-size: 14px; overflow-wrap: anywhere; }
input { width: 100%; font: inherit; color: inherit; background: var(--surface2); border: 1px solid var(--border);
  border-radius: 10px; padding: 12px; margin: 8px 0; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 8px; }
.seg button { padding: 10px; background: var(--surface2); color: var(--muted); border: 1px solid var(--border); }
.seg button[aria-checked="true"] { color: #172414; background: var(--lime); border-color: var(--lime); font-weight: 700; }
#save { width: 100%; padding: 12px; background: var(--lime); color: #172414; font-weight: 700; }
</style>
</head>
<body>
<main>
  <h1>Рація 345</h1>

  <section class="card" id="login" hidden>
    <p class="muted">Токен доступу з файлу <code>.local-radio-stream-token</code> на Mac.</p>
    <input id="token" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Токен">
    <button id="save">Зберегти</button>
  </section>

  <section class="card" id="player" hidden>
    <div class="seg" role="radiogroup" aria-label="Канал">
      <button data-ch="stream" role="radio">Відібрані</button>
      <button data-ch="live" role="radio">Ефір наживо</button>
    </div>
    <p class="muted" id="chHint" style="margin:0 0 10px"></p>
    <button id="toggle">▶ Слухати</button>
    <div class="status"><span class="dot" id="dot"></span><span id="state">Не слухаю</span></div>
    <p class="muted" style="margin-top:8px">Між фразами тиша.
      Екран можна блокувати. Не закривайте вкладку й не вимикайте Tailscale.</p>
  </section>

  <section class="card" id="lastCard" hidden>
    <p class="muted" id="lastMeta">Остання фраза</p>
    <p id="last"></p>
  </section>

  <section class="card" id="histCard" hidden>
    <p class="muted" style="margin-bottom:8px">Останні фрази · ▶ повторити</p>
    <ol id="hist"></ol>
  </section>
</main>

<audio id="live" preload="none"></audio>
<audio id="replay" preload="none"></audio>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const live = $("live"), replay = $("replay");
const KEY = "radio345.streamToken";
let token = "", listening = false, lastId = 0, retry = 0, retryTimer = null, pollTimer = null;
const seen = new Map();
const HINTS = { stream: "Фрази за режимом Telegram, після розпізнавання", live: "Усе мовлення одразу, без відбору за текстом" };
let channel = "stream";
try { channel = localStorage.getItem("radio345.channel") === "live" ? "live" : "stream"; } catch {}
function showChannel() {
  document.querySelectorAll(".seg button").forEach((b) => b.setAttribute("aria-checked", String(b.dataset.ch === channel)));
  $("chHint").textContent = HINTS[channel];
}
document.querySelectorAll(".seg button").forEach((b) => b.onclick = () => {
  if (b.dataset.ch === channel) return;
  channel = b.dataset.ch;
  try { localStorage.setItem("radio345.channel", channel); } catch {}
  showChannel();
  if (listening) { retry = 0; connect(); }
});
showChannel();

function store(get, value) {
  try { return get ? localStorage.getItem(KEY) || "" : localStorage.setItem(KEY, value); } catch { return ""; }
}

function setState(text, kind) {
  $("state").textContent = text;
  $("dot").className = "dot" + (kind ? " " + kind : "");
}

function api(path) {
  const sep = path.includes("?") ? "&" : "?";
  return path + sep + "t=" + encodeURIComponent(token);
}

function showLogin(message) {
  $("login").hidden = false;
  $("player").hidden = true;
  if (message) $("login").querySelector(".muted").textContent = message;
}

async function poll() {
  clearTimeout(pollTimer);
  try {
    const r = await fetch(api("/events?after=" + lastId), { cache: "no-store" });
    if (r.status === 401) { stop(); return showLogin("Токен не підійшов. Введіть токен із .local-radio-stream-token."); }
    if (!r.ok) throw new Error(r.status);
    const data = await r.json();
    for (const clip of data.clips) addClip(clip, lastId > 0);
    if (data.clips.length) lastId = data.clips[data.clips.length - 1].id;
    if (!listening) setState("Не слухаю · Mac на зв'язку", "");
  } catch {
    if (!listening) setState("Mac недоступний. Перевірте Tailscale", "bad");
  }
  pollTimer = setTimeout(poll, document.hidden ? 15000 : 3000);
}

function fmtTime(sec) {
  return new Date(sec * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
}

function addClip(clip, fresh) {
  if (seen.has(clip.id)) return;
  seen.set(clip.id, clip);
  const li = document.createElement("li");
  if (fresh) li.className = "new";
  const btn = document.createElement("button");
  btn.textContent = "▶";
  btn.setAttribute("aria-label", "Повторити фразу");
  btn.onclick = () => { replay.src = api("/clip/" + clip.id + ".mp3"); replay.play().catch(() => {}); };
  const body = document.createElement("div");
  const meta = document.createElement("div");
  meta.className = "meta";
  meta.textContent = fmtTime(clip.at) + " · " + clip.duration_s + " с";
  const text = document.createElement("div");
  text.className = "text";
  text.textContent = clip.caption;
  body.append(meta, text);
  li.append(btn, body);
  $("hist").prepend(li);
  while ($("hist").children.length > 30) $("hist").lastChild.remove();
  $("histCard").hidden = false;
  $("lastCard").hidden = false;
  $("lastMeta").textContent = "Остання фраза · " + fmtTime(clip.at);
  $("last").textContent = clip.caption;
  if ("mediaSession" in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({ title: clip.caption.split("\n").pop() || "Ефір", artist: "Рація 345" });
  }
}

function connect() {
  clearTimeout(retryTimer);
  // Новий запит щоразу: після паузи Safari інакше доігрує старий буфер.
  live.src = api("/" + channel + ".mp3") + "&s=" + Date.now();
  live.play().catch(() => { setState("Натисніть «Слухати» ще раз", "warn"); });
  setState("Підключаюсь…", "warn");
}

function start() {
  listening = true;
  retry = 0;
  $("toggle").textContent = "■ Зупинити";
  $("toggle").classList.add("on");
  connect();
}

function stop() {
  listening = false;
  clearTimeout(retryTimer);
  live.pause();
  live.removeAttribute("src");
  live.load();
  $("toggle").textContent = "▶ Слухати";
  $("toggle").classList.remove("on");
  setState("Не слухаю", "");
}

function scheduleRetry() {
  if (!listening) return;
  retry = Math.min(retry + 1, 6);
  const delay = 1000 * 2 ** (retry - 1);
  setState("Зв'язок втрачено, повтор через " + Math.round(delay / 1000) + " с", "bad");
  clearTimeout(retryTimer);
  retryTimer = setTimeout(connect, delay);
}

live.addEventListener("playing", () => { retry = 0; setState("Слухаю ефір", "ok"); });
live.addEventListener("waiting", () => { if (listening) setState("Буферизація…", "warn"); });
live.addEventListener("error", scheduleRetry);
live.addEventListener("ended", scheduleRetry);
live.addEventListener("stalled", () => { if (listening) setTimeout(() => { if (listening && live.readyState < 3) scheduleRetry(); }, 8000); });
live.addEventListener("pause", () => { if (listening && !live.ended && !live.error) { listening = false; stop(); } });

$("toggle").onclick = () => (listening ? stop() : start());
$("save").onclick = () => {
  token = $("token").value.trim();
  if (!token) return;
  store(false, token);
  $("login").hidden = true;
  $("player").hidden = false;
  poll();
};

if ("mediaSession" in navigator) {
  navigator.mediaSession.setActionHandler("play", start);
  navigator.mediaSession.setActionHandler("pause", stop);
  navigator.mediaSession.setActionHandler("stop", stop);
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });

// Токен можна передати один раз у #t=…; він переноситься в localStorage і зникає з адреси.
const fromHash = new URLSearchParams(location.hash.slice(1)).get("t");
if (fromHash) { store(false, fromHash); history.replaceState(null, "", location.pathname); }
token = fromHash || store(true);
if (token) { $("player").hidden = false; poll(); } else { showLogin(); }
</script>
</body>
</html>
